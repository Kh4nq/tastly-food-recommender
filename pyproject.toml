[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlai-food-recommendation"
version = "0.1.0"
description = "Food recommendation team contracts, AI 2 conversation and integration scaffold"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
openai = ["openai>=2,<3"]
gemini = ["google-genai>=1.50,<2"]
labeling = ["streamlit>=1.32,<2"]
slm = [
    "torch>=2.6,<3",
    "transformers>=4.51,<6",
    "peft>=0.21.2,<1",
    "accelerate>=1,<2",
    "bitsandbytes>=0.50,<1",
]

ai1 = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=15,<22",
    "sentence-transformers>=3,<6",
]
ai3 = [
    "catboost>=1.2,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
]

db = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]

backend = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
